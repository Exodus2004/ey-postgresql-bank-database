version: '3.8'

services:
  # ------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ey-bank-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bank_db
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/all_in_one_bank_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - bank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # pgAdmin 4 Web GUI Interface (Optional visual management tool)
  # Open in browser at http://localhost:5050
  # Login: admin@bank.com / admin123
  # ------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ey-bank-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bank.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bank_pgdata:
